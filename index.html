<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chirurgie Basisexamen – K-Fragen Trainer (Mehrfachauswahl)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-teal-900 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-list-check text-2xl text-teal-300"></i>
        <div>
          <h1 class="font-bold text-lg leading-tight">K-Fragen Trainer</h1>
          <p class="text-xs text-teal-200">Chirurgie Basisexamen (717–948) • Echte Mehrfachauswahl</p>
        </div>
      </div>
      <button id="btnReset" title="Fortschritt zurücksetzen" class="text-xs bg-teal-800 hover:bg-teal-700 px-3 py-1.5 rounded-lg border border-teal-600 transition flex items-center gap-1">
        <i class="fa-solid fa-rotate-left"></i> Reset
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 flex flex-col gap-4">

    <!-- Progress & Filter Bar -->
    <section class="glass-card rounded-2xl p-4 shadow-sm border border-slate-200">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
        <div class="flex items-center space-x-2 text-sm font-medium text-slate-600">
          <span>Frage <strong id="currentIdxDisplay" class="text-teal-700 font-bold text-base">1</strong> von <span id="totalQuestionsDisplay">0</span></span>
          <span class="text-slate-300">|</span>
          <span class="text-emerald-600 font-semibold"><i class="fa-solid fa-check"></i> <span id="correctCount">0</span> Richtig</span>
          <span class="text-rose-600 font-semibold"><i class="fa-solid fa-xmark"></i> <span id="wrongCount">0</span> Falsch</span>
        </div>
        
        <!-- Filter Tabs -->
        <div class="flex flex-wrap gap-1 text-xs">
          <button data-filter="all" class="filter-btn px-2.5 py-1 rounded-md bg-teal-700 text-white font-medium shadow-sm transition">Alle</button>
          <button data-filter="unanswered" class="filter-btn px-2.5 py-1 rounded-md bg-slate-200 text-slate-700 font-medium hover:bg-slate-300 transition">Offen</button>
          <button data-filter="wrong" class="filter-btn px-2.5 py-1 rounded-md bg-slate-200 text-slate-700 font-medium hover:bg-slate-300 transition">Fehler</button>
          <button data-filter="bookmarked" class="filter-btn px-2.5 py-1 rounded-md bg-slate-200 text-slate-700 font-medium hover:bg-slate-300 transition">Gemerkt</button>
        </div>
      </div>

      <!-- Progress bar -->
      <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-teal-600 h-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </section>

    <!-- Question Container -->
    <section id="questionCard" class="glass-card rounded-2xl p-6 shadow-md border border-slate-200 flex-1 flex flex-col justify-between">
      <div>
        <div class="flex items-start justify-between gap-4 mb-4">
          <div class="flex items-center gap-2">
            <span id="questionBadge" class="inline-block bg-teal-100 text-teal-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
              K-Frage 717
            </span>
            <span class="text-xs bg-slate-100 text-slate-500 font-semibold px-2 py-1 rounded-md">
              Mehrfachauswahl: Wähle alle zutreffenden Aussagen
            </span>
          </div>
          <button id="bookmarkBtn" class="text-slate-400 hover:text-amber-500 text-lg transition">
            <i class="fa-regular fa-bookmark"></i>
          </button>
        </div>

        <h2 id="questionPrompt" class="text-lg md:text-xl font-bold text-slate-800 leading-snug mb-5">
          Lade Frage...
        </h2>

        <!-- Answer Options / Checkboxes -->
        <div id="optionsContainer" class="space-y-3">
          <!-- Dynamically populated -->
        </div>

        <!-- Submit Button for active question -->
        <div id="submitContainer" class="mt-4">
          <!-- Submit Button rendered dynamically -->
        </div>
      </div>

      <!-- Explanation Box -->
      <div id="explanationBox" class="mt-6 p-4 rounded-xl border hidden transition-all duration-300">
        <div class="flex items-center justify-between mb-2">
          <div class="font-bold text-sm flex items-center gap-2" id="explanationHeader">
            <i class="fa-solid fa-circle-info"></i> Auswertung
          </div>
          <span id="patternBadge" class="text-xs font-mono font-bold px-2 py-0.5 rounded bg-slate-200 text-slate-700"></span>
        </div>
        <p id="explanationText" class="text-sm leading-relaxed text-slate-700 whitespace-pre-line"></p>
      </div>

      <!-- Navigation Footer -->
      <div class="flex items-center justify-between mt-8 pt-4 border-t border-slate-100">
        <button id="btnPrev" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-xl text-sm transition flex items-center gap-2">
          <i class="fa-solid fa-arrow-left"></i> Zurück
        </button>

        <div class="flex gap-2">
          <button id="btnRandom" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-sm transition" title="Zufällige K-Frage">
            <i class="fa-solid fa-shuffle"></i>
          </button>
          <button id="btnNext" class="px-5 py-2 bg-teal-700 hover:bg-teal-800 text-white font-semibold rounded-xl text-sm shadow-md transition flex items-center gap-2">
            Weiter <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </div>
    </section>

    <!-- Matrix Trigger -->
    <div class="flex justify-center mt-2">
      <button id="openMatrixBtn" class="text-xs text-teal-700 hover:text-teal-900 font-semibold flex items-center gap-1.5 py-1">
        <i class="fa-solid fa-grip"></i> Fragenübersicht (K-Fragen Matrix)
      </button>
    </div>
  </main>

  <!-- Matrix Modal -->
  <div id="matrixModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <h3 class="font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-grip text-teal-700"></i> K-Fragen Matrix (717 bis 948)
        </h3>
        <button id="closeMatrixBtn" class="text-slate-400 hover:text-slate-600 text-lg p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-4 overflow-y-auto custom-scroll flex-1">
        <div id="matrixGrid" class="grid grid-cols-6 sm:grid-cols-8 md:grid-cols-10 gap-2 text-center text-xs font-semibold">
          <!-- Dynamically populated -->
        </div>
      </div>
      <div class="p-3 border-t border-slate-100 bg-slate-50 text-xs flex justify-around text-slate-500">
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-emerald-500 inline-block"></span> Richtig</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-rose-500 inline-block"></span> Falsch</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-slate-200 inline-block"></span> Offen</span>
      </div>
    </div>
  </div>

  <script>
    const kQuestions = [
      {
        id: 717,
        prompt: "Schwitzen während einer Narkose ist ein mögliches Zeichen von:",
        statements: [
          { key: "a", text: "Hypoxie" },
          { key: "b", text: "Hyperkapnie" },
          { key: "c", text: "Zu oberflächliche Narkosetiefe" },
          { key: "d", text: "Sympathikusstimulation" }
        ],
        pattern: "++++",
        comment: "Alle vier Zustände führen zu einer ausgeprägten Aktivierung des sympathischen Nervensystems mit vermehrter Schweißsekretion."
      },
      {
        id: 718,
        prompt: "Kann bei einer Peritonealdialyse vorkommen:",
        statements: [
          { key: "a", text: "Metabolische Alkalose" },
          { key: "b", text: "Hyperglykämie" },
          { key: "c", text: "Proteinverlust" },
          { key: "d", text: "Aminosäureverlust" }
        ],
        pattern: "++++",
        comment: "Durch osmotische Glukoseresorption droht Hyperglykämie; über das Peritoneum diffundieren kontinuierlich Proteine und Aminosäuren."
      },
      {
        id: 719,
        prompt: "Eine Duodenalatresie beim Neugeborenen ist gekennzeichnet durch:",
        statements: [
          { key: "a", text: "Galliges Erbrechen kurz nach Geburt" },
          { key: "b", text: "Normalen Mekoniumabgang" },
          { key: "c", text: "Fehlende Darmgeräusche" },
          { key: "d", text: "Radiologisch luftleeren Dünn- und Dickdarm (Double-Bubble-Phänomen)" }
        ],
        pattern: "++-+",
        comment: "Double-Bubble im Röntgen; distal der Atresie findet sich kein Gas. Mekonium kann initial dennoch normal abgesetzt werden."
      },
      {
        id: 720,
        prompt: "Ein Nierentumor (Adeno-Ca / Hypernephrom) kann sich äussern durch:",
        statements: [
          { key: "a", text: "Schmerzlose isolierte Makrohämaturie" },
          { key: "b", text: "Lumbalschmerz" },
          { key: "c", text: "Langdauernden Fieberzustand (B-Symptomatik)" },
          { key: "d", text: "Typischen bakteriellen Urininfekt" }
        ],
        pattern: "+++-",
        comment: "Klassische Symptomtrias plus paraneoplastisches Tumorfieber. Bakterielle Infekte sind kein typisches Primärzeichen."
      },
      {
        id: 721,
        prompt: "Für den Morbus Crohn ist im Gegensatz zur Colitis ulcerosa typisch:",
        statements: [
          { key: "a", text: "Befällt alle Wandschichten (transmural)" },
          { key: "b", text: "Geht mit Pseudodivertikelbildung einher" },
          { key: "c", text: "Unregelmässiger, segmentaler Darmbefall (Skip Lesions)" },
          { key: "d", text: "Neigt zu Strikturen und Fisteln" }
        ],
        pattern: "+-++",
        comment: "Transmuraler Befall mit Fisteln, Stenosen und diskontinuierlichen Läsionen charakterisiert den Morbus Crohn."
      },
      {
        id: 722,
        prompt: "Spannungs-Pneumothorax:",
        statements: [
          { key: "a", text: "Kann entstehen bei Diskonnektion eines Thorax-Saugdrains bei Überdruckbeatmung" },
          { key: "b", text: "Kompressionsatelektase auf der befallenen Seite" },
          { key: "c", text: "Einseitiger Zwerchfell-Hochstand auf Seite des Pneu" },
          { key: "d", text: "Stellt sich dar unter asymmetrischer Atemmechanik" }
        ],
        pattern: "++-+",
        comment: "Das Zwerchfell steht auf der betroffenen Seite pathologisch tief (Tiefstand durch Ventil-Überdruck)."
      },
      {
        id: 723,
        prompt: "Differentialdiagnose des Fallfusses (Fussheberparese):",
        statements: [
          { key: "a", text: "Peronäusparese (N. fibularis communis)" },
          { key: "b", text: "Wurzelkompression L5" },
          { key: "c", text: "Wurzelläsion L4" },
          { key: "d", text: "Femoralisparese" }
        ],
        pattern: "+++-",
        comment: "M. tibialis anterior wird über L4/L5 innerviert. Der N. femoralis versorgt die Kniestrecker (M. quadriceps)."
      },
      {
        id: 724,
        prompt: "Folgende Symptome lassen nach einer Nierentransplantation an eine Abstossungsreaktion denken:",
        statements: [
          { key: "a", text: "Oligurie" },
          { key: "b", text: "Fieber" },
          { key: "c", text: "Rasche Gewichtszunahme und Transplantatschwellung" },
          { key: "d", text: "Cholestatischer Ikterus" }
        ],
        pattern: "+++-",
        comment: "Verschlechterung der Retentionswerte mit Ödemen, Druckschmerz und Fieber; Ikterus betrifft nicht primär die Nierenfunktion."
      },
      {
        id: 725,
        prompt: "Für die Diagnose einer akut aufgetretenen Extremitätenischämie spricht:",
        statements: [
          { key: "a", text: "Absolute Arrhythmie bei Vorhofflimmern" },
          { key: "b", text: "Nachgewiesene Mitralstenose" },
          { key: "c", text: "Vorbestehende Claudicatio intermittens" },
          { key: "d", text: "Polycythaemia vera" }
        ],
        pattern: "++++",
        comment: "Kardiale Emboliequellen (VHF, Mitralklappe) sowie lokale Gefäßplaques und Hyperviskosität sind typische Ursachen."
      },
      {
        id: 726,
        prompt: "Die chirurgische Sanierung eines venösen Ulcus cruris am Innenknöchel umfasst:",
        statements: [
          { key: "a", text: "Hauttransplantation zur Defektdeckung" },
          { key: "b", text: "Stripping der insuffizienten V. saphena magna" },
          { key: "c", text: "Ligatur der insuffizienten Perforansvenen (Cockett)" },
          { key: "d", text: "Lumbale Sympathektomie" }
        ],
        pattern: "+++-",
        comment: "Ausschaltung der venösen Hypertonie und Ulkusdeckung; Sympathektomie ist nur bei arterieller pAVK indiziert."
      },
      {
        id: 727,
        prompt: "Indikation zur primären therapeutischen Voll-Antikoagulation:",
        statements: [
          { key: "a", text: "Phlegmasia coerulea dolens" },
          { key: "b", text: "Akuter Mesenterialinfarkt vor Laparotomie" },
          { key: "c", text: "Unterschenkel-Venenthrombose" },
          { key: "d", text: "Frischer zerebrovaskulärer Insult" }
        ],
        pattern: "+-+-",
        comment: "Vollheparinisation bei Phlegmasie und TVT; beim akuten ischämischen Hirninfarkt ist Vollheparin kontraindiziert."
      },
      {
        id: 728,
        prompt: "Bei welchen bakteriellen Infekten des Gastrointestinaltraktes können blutige Stühle vorkommen?",
        statements: [
          { key: "a", text: "Salmonellen" },
          { key: "b", text: "Shigellen (Bakterienruhr)" },
          { key: "c", text: "Staphylokokken-Enterotoxin" },
          { key: "d", text: "Campylobacter jejuni" }
        ],
        pattern: "++-+",
        comment: "Invasive Mukosadestruktion durch Shigellen, Salmonellen und Campylobacter; Staphylokokkentoxine machen rein wässrige Diarrhoen."
      },
      {
        id: 729,
        prompt: "Bei PEEP-Beatmung (positive endexpiratory pressure) ist typischerweise erhöht:",
        statements: [
          { key: "a", text: "Zentralvenöser Druck (ZVD)" },
          { key: "b", text: "Herzminutenvolumen (HMV)" },
          { key: "c", text: "Pulmonalkapillärer Druck (PCWP)" },
          { key: "d", text: "Peripher arterieller Mitteldruck" }
        ],
        pattern: "+-+-",
        comment: "Erhöhter intrathorakaler Druck behindert den venösen Rückstrom und steigert ZVD sowie PCWP; das HMV sinkt."
      },
      {
        id: 730,
        prompt: "Patient nach 2 Wochen Bettruhe bildet neu Nierensteine. Ursachen?",
        statements: [
          { key: "a", text: "Sekundärer Hyperparathyreoidismus" },
          { key: "b", text: "Zu geringe Flüssigkeitszufuhr" },
          { key: "c", text: "Immobilisationsbedingte Hyperkalziurie" },
          { key: "d", text: "Alkalischer Urin-pH" }
        ],
        pattern: "-++-",
        comment: "Immobilisation beschleunigt die Knochenresorption mit Hyperkalziurie; Dehydratation führt zur Übersättigung des Harns."
      },
      {
        id: 731,
        prompt: "Ein toxisches Megakolon kann vorkommen bei:",
        statements: [
          { key: "a", text: "Colitis ulcerosa" },
          { key: "b", text: "Morbus Crohn" },
          { key: "c", text: "Amöbenenteritis" },
          { key: "d", text: "Gastrointestinalem Karzinoid" }
        ],
        pattern: "++--",
        comment: "Fulminante CED-Schübe zerstören den Plexus myentericus und führen zur tonuslosen Megakolon-Dilatation."
      },
      {
        id: 732,
        prompt: "Beim septischen Schock kommt typischerweise vor:",
        statements: [
          { key: "a", text: "Erniedrigte Diurese (Oligurie)" },
          { key: "b", text: "Erhöhte Glukosetoleranz" },
          { key: "c", text: "Leukozytose oder Leukopenie" },
          { key: "d", text: "Thrombozytenabfall (Verbrauchskoagulopathie)" }
        ],
        pattern: "+-++",
        comment: "Sepsis induziert eine Stress-Hyperglykämie mit verminderter Glukosetoleranz (Insulinresistenz)."
      },
      {
        id: 733,
        prompt: "Als Organspender kommen prinzipiell in Frage:",
        statements: [
          { key: "a", text: "Hirntote Schädel-Hirn-Traumatiker" },
          { key: "b", text: "Hirntote Patienten mit primärem Hirntumor" },
          { key: "c", text: "Hirntote Patienten mit intrazerebraler Massenblutung" },
          { key: "d", text: "Hirntote Patienten mit metastasiertem extrazerebralem Malignom" }
        ],
        pattern: "+++-",
        comment: "Metastasierte extrazerebrale Malignome schließen eine Organspende wegen Übertragungsgefahr strikt aus."
      },
      {
        id: 734,
        prompt: "Folgen von Fehlern beim Anlegen der pneumatischen Manschette (Blutsperre) an Extremitäten:",
        statements: [
          { key: "a", text: "Vermehrte venöse Blutungen bei unvollständigem Manschettenabschluss" },
          { key: "b", text: "Muskuläre Schwächen aufgrund von Nervenläsionen" },
          { key: "c", text: "Muskuläre Schwächen aufgrund ischämischer Läsionen" },
          { key: "d", text: "Entstehung einer Dupuytren-Kontraktur" }
        ],
        pattern: "+++-",
        comment: "Druckläsionen und Ischämien sind typisch; Morbus Dupuytren ist genetisch determiniert."
      },
      {
        id: 735,
        prompt: "Was trifft auf den einseitigen Kryptorchismus zu?",
        statements: [
          { key: "a", text: "Bedarf keiner Therapie, solange der Partnerhoden deszendiert ist" },
          { key: "b", text: "Ein nicht deszendierter Hoden hat eine signifikant erhöhte Entartungsgefahr" },
          { key: "c", text: "Maligne Hodentumoren entwickeln sich meist bereits im Kindesalter" },
          { key: "d", text: "Die Fertilität ist bei Einseitigkeit völlig unbeeinträchtigt" }
        ],
        pattern: "-+--",
        comment: "Das Malignomrisiko ist 4- bis 10-fach erhöht; Tumoren entstehen typischerweise erst im jungen Erwachsenenalter."
      },
      {
        id: 736,
        prompt: "Symptome einer Cauda-equina-Kompression:",
        statements: [
          { key: "a", text: "Reithosenanästhesie (S3–S5)" },
          { key: "b", text: "Verlust der Bauchhautreflexe" },
          { key: "c", text: "Harnretention mit Überlaufblase" },
          { key: "d", text: "Spastische Paraparese" }
        ],
        pattern: "+-+-",
        comment: "Periphere Nervenwurzelläsion: Schlaffe Paresen, keine Spastik; Ausfall der Sakralwurzeln (Blasenatonie, Reithosenanästhesie)."
      },
      {
        id: 737,
        prompt: "Eine Nierenarterienstenose links geht einher mit:",
        statements: [
          { key: "a", text: "Verlangsamtes Erscheinen der Harnwege links bei IVP-Darstellung" },
          { key: "b", text: "Erhöhte Kreatininkonzentration im Ureterurin links" },
          { key: "c", text: "Erhöhte Katecholaminkonzentration in der V. renalis sinistra" },
          { key: "d", text: "Verminderte Reninkonzentration in der linken Nierenvene" }
        ],
        pattern: "+---",
        comment: "Minderperfusion verzögert die Kontrastmittelausscheidung; die Reninausschüttung der stenotischen Niere ist stark erhöht."
      },
      {
        id: 738,
        prompt: "Welche Aussagen passen zur Colles-Radiusfraktur loco classico?",
        statements: [
          { key: "a", text: "Gipsverband reicht bis an die Fingerspitzen" },
          { key: "b", text: "Prüfung der Durchblutung und Sensibilität am nächsten Tag" },
          { key: "c", text: "Röntgenkontrolle zwischen dem 4. und 7. Tag" },
          { key: "d", text: "Gipsruhigstellung für 10 Wochen" }
        ],
        pattern: "-++-",
        comment: "Fingergrundgelenke müssen frei bleiben; Repositionsverluste treten typischerweise nach Abschwellung in der ersten Woche auf."
      },
      {
        id: 739,
        prompt: "Urotheltumoren können in den ableitenden Harnwegen vorkommen bei chronischem Abusus von:",
        statements: [
          { key: "a", text: "Barbituraten" },
          { key: "b", text: "Phenacetinhaltigen Analgetika" },
          { key: "c", text: "Zigarettenrauch (aromatische Amine)" },
          { key: "d", text: "Alkohol" }
        ],
        pattern: "-++-",
        comment: "Phenacetinabusus und Tabakrauchen sind die beiden führenden chemischen Karzinogene des Urothels."
      },
      {
        id: 740,
        prompt: "Folgende Befunde erhärten beim 2-jährigen Kleinkind den Verdacht auf Hydrocephalus:",
        statements: [
          { key: "a", text: "Hypotonie der unteren Extremitäten" },
          { key: "b", text: "Phänomen der untergehenden Sonne" },
          { key: "c", text: "Verstärktes, überproportionales Kopfwachstum" },
          { key: "d", text: "Gesteigerte Muskeleigenreflexe / Spastik der Beine" }
        ],
        pattern: "-+++",
        comment: "Dehnung der Pyramidenbahnfasern um die erweiterten Ventrikel führt zur Beinspastik; Blickparese nach oben erzeugt das Sonnenuntergangsphänomen."
      },
      {
        id: 741,
        prompt: "Ein chronisches Lymphödem ist charakterisiert durch:",
        statements: [
          { key: "a", text: "Starke Druckdolenz" },
          { key: "b", text: "Harte, nicht eindrückbare Schwellung" },
          { key: "c", text: "Ausgeprägte Stammvarikosis" },
          { key: "d", text: "Blasse Hautfarbe" }
        ],
        pattern: "-+-+",
        comment: "Im Stadium II/III fibrosiert das Interstitium (Stemmer positiv, schmerzlos, blass)."
      },
      {
        id: 742,
