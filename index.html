<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chirurgie Basisexamen – K-Fragen Trainer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-teal-900 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-list-check text-2xl text-teal-300"></i>
        <div>
          <h1 class="font-bold text-lg leading-tight">K-Fragen Trainer</h1>
          <p class="text-xs text-teal-200">Chirurgie Basisexamen (Fragen 717–948)</p>
        </div>
      </div>
      <button id="btnReset" class="text-xs bg-teal-800 hover:bg-teal-700 px-3 py-1.5 rounded-lg border border-teal-600 transition flex items-center gap-1">
        <i class="fa-solid fa-rotate-left"></i> Reset
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 flex flex-col gap-4">

    <!-- Progress & Filter Bar -->
    <section class="glass-card rounded-2xl p-4 shadow-sm border border-slate-200">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
        <div class="flex items-center space-x-2 text-sm font-medium text-slate-600">
          <span>Frage <strong id="currentIdxDisplay" class="text-teal-700 font-bold text-base">1</strong> von <span id="totalQuestionsDisplay">0</span></span>
          <span class="text-slate-300">|</span>
          <span class="text-emerald-600 font-semibold"><i class="fa-solid fa-check"></i> <span id="correctCount">0</span> Richtig</span>
          <span class="text-rose-600 font-semibold"><i class="fa-solid fa-xmark"></i> <span id="wrongCount">0</span> Falsch</span>
        </div>
        
        <!-- Filter Tabs -->
        <div class="flex flex-wrap gap-1 text-xs">
          <button data-filter="all" class="filter-btn px-2.5 py-1 rounded-md bg-teal-700 text-white font-medium shadow-sm transition">Alle</button>
          <button data-filter="unanswered" class="filter-btn px-2.5 py-1 rounded-md bg-slate-200 text-slate-700 font-medium hover:bg-slate-300 transition">Offen</button>
          <button data-filter="wrong" class="filter-btn px-2.5 py-1 rounded-md bg-slate-200 text-slate-700 font-medium hover:bg-slate-300 transition">Fehler</button>
          <button data-filter="bookmarked" class="filter-btn px-2.5 py-1 rounded-md bg-slate-200 text-slate-700 font-medium hover:bg-slate-300 transition">Gemerkt</button>
        </div>
      </div>

      <!-- Progress bar -->
      <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-teal-600 h-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </section>

    <!-- Question Container -->
    <section id="questionCard" class="glass-card rounded-2xl p-6 shadow-md border border-slate-200 flex-1 flex flex-col justify-between">
      <div>
        <div class="flex items-start justify-between gap-4 mb-4">
          <div class="flex items-center gap-2">
            <span id="questionBadge" class="inline-block bg-teal-100 text-teal-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
              K-Frage 717
            </span>
            <span class="text-xs bg-slate-100 text-slate-500 font-semibold px-2 py-1 rounded-md hidden sm:inline-block">
              Wähle alle zutreffenden Aussagen
            </span>
          </div>
          <button id="bookmarkBtn" class="text-slate-400 hover:text-amber-500 text-lg transition">
            <i class="fa-regular fa-bookmark"></i>
          </button>
        </div>

        <h2 id="questionPrompt" class="text-lg md:text-xl font-bold text-slate-800 leading-snug mb-5">
          Lade Frage...
        </h2>

        <!-- Answer Options / Checkboxes -->
        <div id="optionsContainer" class="space-y-3"></div>

        <!-- Submit Button -->
        <div id="submitContainer" class="mt-4"></div>
      </div>

      <!-- Explanation Box -->
      <div id="explanationBox" class="mt-6 p-4 rounded-xl border hidden transition-all duration-300">
        <div class="flex items-center justify-between mb-2">
          <div class="font-bold text-sm flex items-center gap-2" id="explanationHeader">
            <i class="fa-solid fa-circle-info"></i> Auswertung
          </div>
          <span id="patternBadge" class="text-xs font-mono font-bold px-2 py-0.5 rounded bg-slate-200 text-slate-700"></span>
        </div>
        <p id="explanationText" class="text-sm leading-relaxed text-slate-700 whitespace-pre-line"></p>
      </div>

      <!-- Navigation Footer -->
      <div class="flex items-center justify-between mt-8 pt-4 border-t border-slate-100">
        <button id="btnPrev" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-xl text-sm transition flex items-center gap-2">
          <i class="fa-solid fa-arrow-left"></i> Zurück
        </button>

        <div class="flex gap-2">
          <button id="btnRandom" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-sm transition" title="Zufall">
            <i class="fa-solid fa-shuffle"></i>
          </button>
          <button id="btnNext" class="px-5 py-2 bg-teal-700 hover:bg-teal-800 text-white font-semibold rounded-xl text-sm shadow-md transition flex items-center gap-2">
            Weiter <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </div>
    </section>

    <!-- Matrix Trigger -->
    <div class="flex justify-center mt-2">
      <button id="openMatrixBtn" class="text-xs text-teal-700 hover:text-teal-900 font-semibold flex items-center gap-1.5 py-1">
        <i class="fa-solid fa-grip"></i> Fragenübersicht (Matrix)
      </button>
    </div>
  </main>

  <!-- Matrix Modal -->
  <div id="matrixModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <h3 class="font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-grip text-teal-700"></i> K-Fragen Matrix (717 bis 948)
        </h3>
        <button id="closeMatrixBtn" class="text-slate-400 hover:text-slate-600 text-lg p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-4 overflow-y-auto custom-scroll flex-1">
        <div id="matrixGrid" class="grid grid-cols-6 sm:grid-cols-8 md:grid-cols-10 gap-2 text-center text-xs font-semibold"></div>
      </div>
      <div class="p-3 border-t border-slate-100 bg-slate-50 text-xs flex justify-around text-slate-500">
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-emerald-500 inline-block"></span> Richtig</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-rose-500 inline-block"></span> Falsch</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-slate-200 inline-block"></span> Offen</span>
      </div>
    </div>
  </div>

  <script>
    const kQuestions = [
      {
        id: 717,
        prompt: "Schwitzen während einer Narkose als Zeichen von:",
        statements: [
          { key: "a", text: "Hypoxie" },
          { key: "b", text: "Hyperkapnie" },
          { key: "c", text: "Zu oberflächliche Narkose" },
          { key: "d", text: "Sympathikusstimulation" }
        ],
        pattern: "++++",
        comment: "Alle 4 Faktoren aktivieren den Sympathikus und lösen Schwitzen aus."
      },
      {
        id: 718,
        prompt: "Kann bei einer Peritonealdialyse vorkommen:",
        statements: [
          { key: "a", text: "Metabolische Alkalose" },
          { key: "b", text: "Hyperglykämie" },
          { key: "c", text: "Proteinverlust" },
          { key: "d", text: "Aminosäureverlust" }
        ],
        pattern: "++++",
        comment: "Glukoseresorption führt zu Hyperglykämie; Proteine und Aminosäuren diffundieren ins Dialysat."
      },
      {
        id: 719,
        prompt: "Eine Duodenalatresie ist gekennzeichnet durch:",
        statements: [
          { key: "a", text: "Erbrechen" },
          { key: "b", text: "Normalen Mekoniumabgang" },
          { key: "c", text: "Fehlende Darmgeräusche" },
          { key: "d", text: "Radiologisch luftleeren Dünn- und Dickdarm" }
        ],
        pattern: "++-+",
        comment: "Double-Bubble im Röntgen; distal der Atresie findet sich kein Gas. Mekoniumabgang initial möglich."
      },
      {
        id: 720,
        prompt: "Ein Nierentumor (Adeno-Ca oder Hypernephrom) kann sich äussern durch:",
        statements: [
          { key: "a", text: "Schmerzlose isolierte Makrohämaturie" },
          { key: "b", text: "Lumbalschmerz" },
          { key: "c", text: "Langdauernden Fieberzustand" },
          { key: "d", text: "Urininfekt" }
        ],
        pattern: "+++-",
        comment: "Klassische Symptomtrias plus paraneoplastisches Tumorfieber."
      },
      {
        id: 721,
        prompt: "Für den Morbus Crohn ist im Gegensatz zur Colitis ulcerosa typisch:",
        statements: [
          { key: "a", text: "Befällt alle Wandschichten" },
          { key: "b", text: "Geht mit Pseudodivertikelbildung einher" },
          { key: "c", text: "Unregelmässiger Darmbefall" },
          { key: "d", text: "Neigt zu Strikturen" }
        ],
        pattern: "+-++",
        comment: "Transmuraler, segmentaler Befall (Skip-Lesions) mit Strikturen und Fisteln."
      },
      {
        id: 722,
        prompt: "Spannungs-Pneumothorax:",
        statements: [
          { key: "a", text: "Kann entstehen bei Dekonnektion eines Thorax-Saugdrains bei assistierter Beatmung" },
          { key: "b", text: "Atelektase auf befallener Seite" },
          { key: "c", text: "Einseitiger Zwerchfell-Hochstand auf Seite des Pneu" },
          { key: "d", text: "Stellt sich dar unter asymm. Atmung" }
        ],
        pattern: "++-+",
        comment: "Das Zwerchfell steht auf der betroffenen Seite pathologisch tief (Tiefstand)."
      },
      {
        id: 723,
        prompt: "Differentialdiagnose des Fallfusses:",
        statements: [
          { key: "a", text: "Peronäusparese" },
          { key: "b", text: "Wurzelkompression L5" },
          { key: "c", text: "Wurzelläsion L4" },
          { key: "d", text: "Femoralisparese" }
        ],
        pattern: "+++-",
        comment: "M. tibialis anterior wird über L4/L5 innerviert. Der N. femoralis versorgt die Kniestrecker."
      },
      {
        id: 724,
        prompt: "Folgende Symptome lassen nach einer Nierentransplantation an eine Abstossungsreaktion denken:",
        statements: [
          { key: "a", text: "Oligurie" },
          { key: "b", text: "Fieber" },
          { key: "c", text: "Gewichtszunahme" },
          { key: "d", text: "Ikterus" }
        ],
        pattern: "+++-",
        comment: "Transplantatdysfunktion mit Flüssigkeitsretention und Überwärmung/Druckschmerz des Organs."
      },
      {
        id: 725,
        prompt: "Für die Diagnose einer akut aufgetretenen Extremitätenischämie spricht:",
        statements: [
          { key: "a", text: "Absolute Arrhythmie" },
          { key: "b", text: "Nachgewiesene Mitralstenose" },
          { key: "c", text: "Claudicatio intermittens" },
          { key: "d", text: "Polycytämia vera" }
        ],
        pattern: "++++",
        comment: "Kardiale Emboliequellen (a, b) sowie lokale Plaques/Hyperviskosität (c, d) sind typisch."
      },
      {
        id: 726,
        prompt: "Die chirurgische Sanierung eines venösen Ulcus cruris im Bereich des inneren Knöchels umfasst:",
        statements: [
          { key: "a", text: "Hauttransplantat" },
          { key: "b", text: "Stripping der insuffizienten V. saphena magna" },
          { key: "c", text: "Ligatur der insuff. Verbindungsvenen" },
          { key: "d", text: "Lumbale Sympathektomie" }
        ],
        pattern: "+++-",
        comment: "Beseitigung des venösen Hypertonus und Ulkusdeckung; Sympathektomie ist nur bei pAVK indiziert."
      },
      {
        id: 727,
        prompt: "Indikation zur primären Antikoagulation:",
        statements: [
          { key: "a", text: "Phlegmasia coerulea dolens" },
          { key: "b", text: "Mesenterialinfarkt" },
          { key: "c", text: "Unterschenkel-Venenthrombose" },
          { key: "d", text: "Cerebrovaskulärer Insult" }
        ],
        pattern: "+-+-",
        comment: "Sofortige Antikoagulation bei venösen Thrombosen; beim akuten ischämischen Hirninfarkt kontraindiziert."
      },
      {
        id: 728,
        prompt: "Bei welchen bakt. Infekten des Gl-Traktes können blutige Stühle vorkommen?",
        statements: [
          { key: "a", text: "Salmonellen" },
          { key: "b", text: "Shigellen" },
          { key: "c", text: "Staphylokokken" },
          { key: "d", text: "Campylobacter" }
        ],
        pattern: "++-+",
        comment: "Invasive Keime (Shigellen, Salmonellen, Campylobacter) zerstören die Mukosa; Staphylokokken machen wässrige Diarrhoe."
      },
      {
        id: 729,
        prompt: "Bei PEEP (positive endexpiratory pressure) Beatmung ist erhöht:",
        statements: [
          { key: "a", text: "ZVD" },
          { key: "b", text: "HMV" },
          { key: "c", text: "Pulmonal kapillärer Druck" },
          { key: "d", text: "Peripher arterieller Druck" }
        ],
        pattern: "+-+-",
        comment: "Erhöhter intrathorakaler Druck behindert den venösen Rückstrom und steigert ZVD und PCWP."
      },
      {
        id: 730,
        prompt: "Pat, seit 2 Wochen wegen Wirbelsäulenfraktur bettlägerig, hat neu aufgetreten einen Nierenstein. Ursachen?",
        statements: [
          { key: "a", text: "Sek. Hyperparathyreoidismus" },
          { key: "b", text: "Zu wenig Flüssigkeitszufuhr" },
          { key: "c", text: "Durch Bettlägrigkeit bedingt" },
          { key: "d", text: "Durch alkalischen Urin bedingt" }
        ],
        pattern: "-++-",
        comment: "Immobilisation führt zum Knochenabbau mit Hyperkalziurie; Dehydratation begünstigt Kristallbildung."
      },
      {
        id: 731,
        prompt: "Toxisches Megakolon bei:",
        statements: [
          { key: "a", text: "Colitis ulcerosa" },
          { key: "b", text: "M. Crohn" },
          { key: "c", text: "Amöbenenteritis" },
          { key: "d", text: "Karzinoid" }
        ],
        pattern: "++--",
        comment: "Schwere Schübe bei CED zerstören den Plexus myentericus und führen zur Atonie."
      },
      {
        id: 732,
        prompt: "Beim septischen Schock kommt vor:",
        statements: [
          { key: "a", text: "Erniedrigte Diurese" },
          { key: "b", text: "Erhöhte Glukosetoleranz" },
          { key: "c", text: "Erh. oder erniedr. Leukozyten" },
          { key: "d", text: "Thrombozytenabfall" }
        ],
        pattern: "+-++",
        comment: "Sepsis induziert eine Stresshyperglykämie mit verminderter Glukosetoleranz (Insulinresistenz)."
      },
      {
        id: 733,
        prompt: "Als Organspender kommen in Frage:",
        statements: [
          { key: "a", text: "Hirntote Schädel-Hirn Traumatiker" },
          { key: "b", text: "Hirntote Pat. mit primärem Hirntumor" },
          { key: "c", text: "Hirntote Pat. mit intrazerebraler Blutung" },
          { key: "d", text: "Hirntote Pat. mit extrazerebralem Malignom" }
        ],
        pattern: "+++-",
        comment: "Metastasierte extrazerebrale Malignome schließen eine Organspende wegen Übertragungsgefahr strikt aus."
      },
      {
        id: 734,
        prompt: "Welches sind die Folgen von Fehlern beim Anlegen der pneumatischen Manschette bei Eingriffen an den Extremitäten in Blutleere?",
        statements: [
          { key: "a", text: "Vermehrte venöse Blutungen" },
          { key: "b", text: "Muskuläre Schwächen aufgrund neuraler Läsionen" },
          { key: "c", text: "Muskuläre Schwächen aufgrund ischämischer Läsionen" },
          { key: "d", text: "Dupuytren-Kontraktur" }
        ],
        pattern: "+++-",
        comment: "Druck- und Ischämieschäden; Morbus Dupuytren ist genetisch bedingt."
      },
      {
        id: 735,
        prompt: "Was trifft auf den einseitigen Kryptorchismus zu?",
        statements: [
          { key: "a", text: "Bedarf keiner Therapie, solange der andere Hoden normal deszendiert ist" },
          { key: "b", text: "Ein nicht deszendierter Hoden hat eine erhöhte Entartungsgefahr" },
          { key: "c", text: "Maligne Hodentumoren bei Kryptorchismus entwickeln sich oft schon im Kindesalter" },
          { key: "d", text: "Die Fertilität ist bei einseitigem Kryptorchismus nicht gefährdet" }
        ],
        pattern: "-+--",
        comment: "Malignitätsrisiko ist 4- bis 10-fach erhöht; Tumoren entstehen typischerweise erst im Erwachsenenalter."
      },
      {
        id: 736,
        prompt: "Symptome einer Cauda equina-Kompression:",
        statements: [
          { key: "a", text: "Reithosenanaesthesie" },
          { key: "b", text: "Verlust der Bauchhautreflexe" },
          { key: "c", text: "Harnretention" },
          { key: "d", text: "Spastische Paraparese" }
        ],
        pattern: "+-+-",
        comment: "Periphere Nervenwurzelläsion: Schlaffe Paresen, keine Spastik; Ausfall von S3–S5 führt zur Reithosenanästhesie."
      },
      {
        id: 737,
        prompt: "Eine Nierenarterienstenose links geht einher mit:",
        statements: [
          { key: "a", text: "Verlangsamtes Erscheinen der Harnwege li bei IVP-Darstellung" },
          { key: "b", text: "Erhöhte Kreatininkonzentration im linken Ureterurin" },
          { key: "c", text: "Erhöhte Katecholaminkonzentration in der V. renalis li." },
          { key: "d", text: "Verminderte Reninkonzentration in der li Nierenvene" }
        ],
        pattern: "+---",
        comment: "Minderperfusion verzögert die Ausscheidung; die Reninausschüttung ist stark erhöht."
      },
      {
        id: 738,
        prompt: "Welche Aussagen passen zu Radiusfx loco classico?",
        statements: [
          { key: "a", text: "Gips bis an die Fingerspitzen" },
          { key: "b", text: "Prüfung der Durchblutung und Sensibilität am nächsten Tag" },
          { key: "c", text: "Eine Röntgen-Kontrolle zw. 4. und 6. Tag" },
          { key: "d", text: "Gips für 10 Wochen" }
        ],
        pattern: "-++-",
        comment: "Fingergrundgelenke müssen frei bleiben; Röntgenkontrolle nach Abschwellung in Woche 1."
      },
      {
        id: 739,
        prompt: "Urothel-Tumoren können in den ableitenden Harnwegen vorkommen bei chron. Abusus von:",
        statements: [
          { key: "a", text: "Barbituraten" },
          { key: "b", text: "Phenacetinhaltigen Analgetica" },
          { key: "c", text: "Zigaretten" },
          { key: "d", text: "Alkohol" }
        ],
        pattern: "-++-",
        comment: "Phenacetinabusus und Rauchen sind gesicherte Kanzerogene des Urothels."
      },
      {
        id: 740,
        prompt: "Folgende Befunde erhärten bei 2j. Kleinkind Verdacht auf Hydrocephalus:",
        statements: [
          { key: "a", text: "Hypotonie der unteren Extremitäten" },
          { key: "b", text: "Phänomen der untergehenden Sonne" },
          { key: "c", text: "Verstärktes Kopfwachstum" },
          { key: "d", text: "Verstärkte Patellarsehnenreflexe" }
        ],
        pattern: "-+++",
        comment: "Kompression der kortikospinalen Bahnen führt zu Beinspastik und gesteigerten Reflexen; Blickparese nach oben."
      },
      {
        id: 741,
        prompt: "Ein chronisches Lymphoödem ist charakterisiert durch:",
        statements: [
          { key: "a", text: "Druckdolenz" },
          { key: "b", text: "Harte Schwellung" },
          { key: "c", text: "Varikosis" },
          { key: "d", text: "Blasse Hautfarbe" }
        ],
        pattern: "-+-+",
        comment: "Im Stadium II/III fibrosiert das Gewebe (Stemmer positiv, schmerzlos, blass)."
      },
      {
        id: 742,
        prompt: "Erstversorgung eines Patienten mit Verbrennungen von 30% der Körperoberfläche vor dem Transport:",
        statements: [
          { key: "a", text: "Schmerzmittel-Gabe" },
          { key: "b", text: "Anlegen einer i.v.-Infusion" },
          { key: "c", text: "Breitspektrum-Antibiotikum" },
          { key: "d", text: "Desinfektion der verbrannten Hautstellen" }
        ],
        pattern: "++--",
        comment: "Priorität haben Volumenersatz und Analgesie; lokale Desinfektion ist präklinisch obsolet."
      },
      {
        id: 743,
        prompt: "Wie wirkt Diazepam (Valium)?",
        statements: [
          { key: "a", text: "Antikonvulsiv" },
          { key: "b", text: "Analgetisch" },
          { key: "c", text: "Curarisierend" },
          { key: "d", text: "Macht Amnesie" }
        ],
        pattern: "+--+",
        comment: "Sedierend, antikonvulsiv und amnestisch; keine analgetische oder muskelrelaxierende Eigenwirkung."
      },
      {
        id: 744,
        prompt: "Pleuraempyem als Komplikation von:",
        statements: [
          { key: "a", text: "Bakterieller Pneumonie" },
          { key: "b", text: "Infekt nach Lungen-OP" },
          { key: "c", text: "Fremdkörperpenetration im Pleuraraum" },
          { key: "d", text: "Sarkoidose" }
        ],
        pattern: "+++-",
        comment: "Bakterielle Infektionen; Sarkoidose ist eine sterile granulomatöse Erkrankung."
      },

    let quizState = {
      currentIndex: 0,
      filter: 'all',
      answers: {},
      bookmarks: []
    };

    let currentSelection = [];

    function loadState() {
      // Neuer Schlüsselname 'chirurgie_k_clean_v3' ignoriert alte defekte Speicherstände komplett
      const saved = localStorage.getItem('chirurgie_k_clean_v3');
      if (saved) {
        try {
          quizState = JSON.parse(saved);
        } catch (e) {
          quizState = { currentIndex: 0, filter: 'all', answers: {}, bookmarks: [] };
        }
      }
      if (!Array.isArray(quizState.bookmarks)) quizState.bookmarks = [];
      if (!quizState.answers || typeof quizState.answers !== 'object') quizState.answers = {};
      quizState.filter = 'all';
      if (quizState.currentIndex < 0 || quizState.currentIndex >= kQuestions.length) {
        quizState.currentIndex = 0;
      }
    }

    function saveState() {
      localStorage.setItem('chirurgie_k_clean_v3', JSON.stringify(quizState));
    }

    function getFilteredQuestions() {
      return kQuestions.filter(q => {
        const ans = quizState.answers[q.id];
        if (quizState.filter === 'unanswered') return !ans;
        if (quizState.filter === 'wrong') return ans && !ans.isCorrect;
        if (quizState.filter === 'bookmarked') return quizState.bookmarks.includes(q.id);
        return true;
      });
    }

    function getExpectedKeys(pattern) {
      const res = [];
      const clean = pattern.trim();
      for (let i = 0; i < clean.length && i < 4; i++) {
        if (clean[i] === '+') {
          res.push(String.fromCharCode(97 + i));
        }
      }
      return res;
    }

    function updateStats() {
      let correct = 0;
      let wrong = 0;
      Object.values(quizState.answers).forEach(a => {
        if (a && a.isCorrect) correct++;
        else if (a) wrong++;
      });

      document.getElementById('correctCount').textContent = correct;
      document.getElementById('wrongCount').textContent = wrong;

      const filtered = getFilteredQuestions();
      document.getElementById('totalQuestionsDisplay').textContent = filtered.length;
      document.getElementById('currentIdxDisplay').textContent = filtered.length > 0 ? (quizState.currentIndex + 1) : 0;

      const answeredTotal = Object.keys(quizState.answers).length;
      const pct = Math.round((answeredTotal / kQuestions.length) * 100);
      document.getElementById('progressBar').style.width = `${pct}%`;
    }

    function renderCurrentQuestion() {
      let filtered = getFilteredQuestions();
      const optionsDiv = document.getElementById('optionsContainer');
      const submitDiv = document.getElementById('submitContainer');
      const expBox = document.getElementById('explanationBox');

      if (filtered.length === 0) {
        quizState.filter = 'all';
        updateFilterButtons();
        filtered = getFilteredQuestions();
      }

      if (quizState.currentIndex >= filtered.length || quizState.currentIndex < 0) {
        quizState.currentIndex = 0;
      }

      const q = filtered[quizState.currentIndex];
      const savedAnswer = quizState.answers[q.id];
      const isBookmarked = quizState.bookmarks.includes(q.id);
      const expectedKeys = getExpectedKeys(q.pattern);

      document.getElementById('questionBadge').textContent = `K-Frage ${q.id}`;
      document.getElementById('questionPrompt').textContent = q.prompt;

      const bmIcon = document.querySelector('#bookmarkBtn i');
      bmIcon.className = isBookmarked ? 'fa-solid fa-bookmark text-amber-500' : 'fa-regular fa-bookmark';

      optionsDiv.innerHTML = '';
      submitDiv.innerHTML = '';

      q.statements.forEach(stmt => {
        const isSelected = savedAnswer 
          ? savedAnswer.selected.includes(stmt.key) 
          : currentSelection.includes(stmt.key);
        
        const isActuallyCorrect = expectedKeys.includes(stmt.key);

        const row = document.createElement('div');
        row.className = 'w-full p-4 rounded-xl border transition flex items-start justify-between cursor-pointer text-sm md:text-base font-medium select-none ';

        let boxIcon = '';
        
        if (savedAnswer) {
          row.style.cursor = 'default';
          if (isActuallyCorrect && isSelected) {
            row.className += 'border-emerald-500 bg-emerald-50/80 text-emerald-950';
            boxIcon = `<span class="w-6 h-6 rounded-md bg-emerald-600 text-white flex items-center justify-center text-xs mr-3 shrink-0"><i class="fa-solid fa-check"></i></span>`;
          } else if (!isActuallyCorrect && isSelected) {
            row.className += 'border-rose-400 bg-rose-50/80 text-rose-950';
            boxIcon = `<span class="w-6 h-6 rounded-md bg-rose-600 text-white flex items-center justify-center text-xs mr-3 shrink-0"><i class="fa-solid fa-xmark"></i></span>`;
          } else if (isActuallyCorrect && !isSelected) {
            row.className += 'border-dashed border-emerald-500 bg-emerald-50/40 text-emerald-900';
            boxIcon = `<span class="w-6 h-6 rounded-md border-2 border-emerald-600 text-emerald-600 flex items-center justify-center text-xs mr-3 shrink-0"><i class="fa-solid fa-check"></i></span>`;
          } else {
            row.className += 'border-slate-200 bg-slate-50/50 opacity-60 text-slate-500';
            boxIcon = `<span class="w-6 h-6 rounded-md border border-slate-300 flex items-center justify-center text-xs mr-3 shrink-0"></span>`;
          }
        } else {
          if (isSelected) {
            row.className += 'border-teal-600 bg-teal-50/80 text-teal-950 shadow-sm';
            boxIcon = `<span class="w-6 h-6 rounded-md bg-teal-600 text-white flex items-center justify-center text-xs mr-3 shrink-0"><i class="fa-solid fa-check"></i></span>`;
          } else {
            row.className += 'border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-700';
            boxIcon = `<span class="w-6 h-6 rounded-md border border-slate-300 flex items-center justify-center text-xs mr-3 shrink-0"></span>`;
          }

          row.onclick = () => {
            const idx = currentSelection.indexOf(stmt.key);
            if (idx > -1) {
              currentSelection.splice(idx, 1);
            } else {
              currentSelection.push(stmt.key);
            }
            renderCurrentQuestion();
          };
        }

        row.innerHTML = `
          <div class="flex items-start">
            ${boxIcon}
            <div>
              <strong class="uppercase text-slate-500 font-bold mr-1.5">[${stmt.key}]</strong>
              <span>${stmt.text}</span>
            </div>
          </div>
        `;
        optionsDiv.appendChild(row);
      });

      if (!savedAnswer) {
        const btnCheck = document.createElement('button');
        btnCheck.className = 'w-full py-3 bg-teal-700 hover:bg-teal-800 text-white font-bold rounded-xl shadow transition flex items-center justify-center gap-2';
        btnCheck.innerHTML = `<i class="fa-solid fa-clipboard-check"></i> Antwort prüfen (${currentSelection.length} gewählt)`;
        btnCheck.onclick = () => {
          submitAnswer(q, expectedKeys);
        };
        submitDiv.appendChild(btnCheck);
      }

      if (savedAnswer) {
        expBox.classList.remove('hidden');
        document.getElementById('patternBadge').textContent = `Muster: ${q.pattern}`;

        if (savedAnswer.isCorrect) {
          expBox.className = 'mt-6 p-4 rounded-xl border border-emerald-200 bg-emerald-50/80 text-emerald-950';
          document.getElementById('explanationHeader').innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600"></i> Perfekt! Vollständig richtig.';
        } else {
          expBox.className = 'mt-6 p-4 rounded-xl border border-rose-200 bg-rose-50/80 text-rose-950';
          document.getElementById('explanationHeader').innerHTML = '<i class="fa-solid fa-circle-xmark text-rose-600"></i> Nicht vollständig korrekt.';
        }
        document.getElementById('explanationText').textContent = q.comment;
      } else {
        expBox.classList.add('hidden');
      }

      updateStats();
    }

    function submitAnswer(q, expectedKeys) {
      const user = [...currentSelection].sort();
      const exp = [...expectedKeys].sort();

      const isCorrect = user.length === exp.length && user.every((val, i) => val === exp[i]);

      quizState.answers[q.id] = {
        selected: user,
        isCorrect: isCorrect
      };

      currentSelection = [];
      saveState();
      renderCurrentQuestion();
    }

    function renderMatrix() {
      const grid = document.getElementById('matrixGrid');
      grid.innerHTML = '';
      kQuestions.forEach(q => {
        const ans = quizState.answers[q.id];
        const btn = document.createElement('button');
        btn.className = 'p-2 rounded-lg border font-bold transition flex items-center justify-center ';

        if (ans) {
          btn.className += ans.isCorrect 
            ? 'bg-emerald-500 border-emerald-600 text-white hover:bg-emerald-600'
            : 'bg-rose-500 border-rose-600 text-white hover:bg-rose-600';
        } else {
          btn.className += 'bg-slate-100 border-slate-200 text-slate-700 hover:bg-slate-200';
        }

        btn.textContent = q.id;
        btn.onclick = () => {
          quizState.filter = 'all';
          updateFilterButtons();
          const filtered = getFilteredQuestions();
          const idx = filtered.findIndex(item => item.id === q.id);
          if (idx !== -1) {
            quizState.currentIndex = idx;
          }
          currentSelection = [];
          document.getElementById('matrixModal').classList.add('hidden');
          renderCurrentQuestion();
        };
        grid.appendChild(btn);
      });
    }

    function updateFilterButtons() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.filter === quizState.filter) {
          btn.className = 'filter-btn px-2.5 py-1 rounded-md bg-teal-700 text-white font-medium shadow-sm transition';
        } else {
          btn.className = 'filter-btn px-2.5 py-1 rounded-md bg-slate-200 text-slate-700 font-medium hover:bg-slate-300 transition';
        }
      });
    }

    document.getElementById('btnNext').addEventListener('click', () => {
      const filtered = getFilteredQuestions();
      if (filtered.length > 0) {
        currentSelection = [];
        quizState.currentIndex = (quizState.currentIndex + 1) % filtered.length;
        renderCurrentQuestion();
      }
    });

    document.getElementById('btnPrev').addEventListener('click', () => {
      const filtered = getFilteredQuestions();
      if (filtered.length > 0) {
        currentSelection = [];
        quizState.currentIndex = (quizState.currentIndex - 1 + filtered.length) % filtered.length;
        renderCurrentQuestion();
      }
    });

    document.getElementById('btnRandom').addEventListener('click', () => {
      const filtered = getFilteredQuestions();
      if (filtered.length > 1) {
        currentSelection = [];
        let rand;
        do {
          rand = Math.floor(Math.random() * filtered.length);
        } while (rand === quizState.currentIndex);
        quizState.currentIndex = rand;
        renderCurrentQuestion();
      }
    });

    document.getElementById('bookmarkBtn').addEventListener('click', () => {
      const filtered = getFilteredQuestions();
      if (filtered.length === 0) return;
      const q = filtered[quizState.currentIndex];
      const idx = quizState.bookmarks.indexOf(q.id);
      if (idx >= 0) quizState.bookmarks.splice(idx, 1);
      else quizState.bookmarks.push(q.id);
      saveState();
      renderCurrentQuestion();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        quizState.filter = e.target.dataset.filter;
        quizState.currentIndex = 0;
        currentSelection = [];
        updateFilterButtons();
        renderCurrentQuestion();
      });
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      if (confirm('Möchtest du deinen Lernfortschritt wirklich komplett zurücksetzen?')) {
        quizState.answers = {};
        quizState.bookmarks = [];
        quizState.currentIndex = 0;
        currentSelection = [];
        saveState();
        renderCurrentQuestion();
      }
    });

    document.getElementById('openMatrixBtn').addEventListener('click', () => {
      renderMatrix();
      document.getElementById('matrixModal').classList.remove('hidden');
    });

    document.getElementById('closeMatrixBtn').addEventListener('click', () => {
      document.getElementById('matrixModal').classList.add('hidden');
    });

    // Start-Initialisierung
    loadState();
    updateFilterButtons();
    renderCurrentQuestion();
  </script>
</body>
</html>
